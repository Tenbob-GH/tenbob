<body class="front">
<div id="app">
  <div id="topRow">
    <a id="homeBtn" href="/">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.2 3 11h2v9h6v-6h2v6h6v-9h2L12 3.2z"/></svg>
      <span>Home</span>
    </a>
    <div id="coins" aria-label="Other prices"></div>
  </div>

  <div id="plot">
    <canvas id="chart" aria-hidden="true"></canvas>
    <div id="haze" aria-hidden="true"></div>
    <canvas id="volChart" aria-hidden="true"></canvas>

    <div id="hero">
      <div id="heroInner">
        <div id="heroGlow" aria-hidden="true"></div>
        <h1 id="pair">
          <svg id="xrpMark" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#fff"/>
            <path d="M27 28h9l14 13 14-13h9L56 44a9 9 0 0 1-12 0zM27 72h9l14-13 14 13h9L56 56a9 9 0 0 0-12 0z" fill="#0b1424"/></svg>
          XRP / USD
        </h1>
        <div id="priceWrap"><div id="price" aria-label="XRP price in US dollars">$-.----</div></div>
        <div id="change" class="up"><span id="arrow">▲</span><span id="pct">0.00%</span><small>24H</small></div>
      </div>
    </div>

    <div id="hl">
      <div class="hlBox" id="hlHigh"><span class="k">HIGH</span><span class="v" id="hlHighV">-</span></div>
      <div class="hlBox" id="hlLow"><span class="k">LOW</span><span class="v" id="hlLowV">-</span></div>
    </div>

    <div id="mascot">
      <div class="aura" aria-hidden="true"></div>
      <div class="body">
        <img src="frog.webp" alt="">
        <div class="tint" aria-hidden="true"></div>
      </div>
      <span class="fx sp" style="left:78%;top:18%" aria-hidden="true">✨</span>
      <span class="fx sp" style="left:4%;top:36%" aria-hidden="true">✨</span>
      <span class="fx sp" style="left:40%;top:4%" aria-hidden="true">⭐</span>
      <span class="fx sw" aria-hidden="true">💧</span>
      <div class="bub"></div>
    </div>

    <div id="maCross"></div>
    <div id="banner" aria-live="polite"><div class="band" id="bannerText"></div></div>
    <div id="flash" aria-live="polite"><div class="fband"><span class="ftag" id="flashTag"></span><span class="ftxt" id="flashText"></span></div></div>

    <a id="subCard" href="https://www.youtube.com/@Tenbob_YT" target="_blank" rel="noopener">
      <span class="sfrog"><span class="sfw"><img alt="" src="frog.webp" id="subFrog"></span></span>
      <span class="sbtn"><svg width="44" height="32" viewBox="0 0 44 32" aria-hidden="true"><rect width="44" height="32" rx="8" fill="#fff"/><path d="M17 9l12 7-12 7z" fill="#ff0000"/></svg>SUBSCRIBE</span>
      <span class="stxt"><b>@Tenbob_YT</b><span>for 24/7 XRP live price</span></span>
    </a>
  </div>

  <section id="stats" aria-label="24 hour stats">
    <div class="stat"><span class="k">Vol XRP</span><span class="v" id="vol">-</span></div>
    <div class="stat"><span class="k">Vol USD</span><span class="v" id="qvol">-</span></div>
    <div class="stat" id="eurStat"><span class="k">EUR</span><span class="v" id="eur">-</span></div>
  </section>

  <div id="ticker">
    <div id="tickerTag">LIVE</div>
    <div id="tickerText"></div>
    <span id="credit"><i id="status"></i><span id="creditText">Connecting...</span></span>
  </div>

  <div id="controls" role="toolbar" aria-label="Sound and display controls">
    <button id="sndBtn" type="button" aria-pressed="false">Tap for sound</button>
    <label id="volWrap" title="Volume"><span aria-hidden="true">Vol</span>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="0.5" aria-label="Volume"></label>
    <button id="ticksBtn" type="button" aria-pressed="true" title="Ping or pong on a price move">Ticks: ON</button>
    <button id="musicBtn" type="button" aria-pressed="false">Music: OFF</button>
    <span id="trackName" aria-live="polite"></span>
    <button id="fsBtn" type="button" title="Full screen (F)">Full screen</button>
    <a id="ytBtn" href="https://www.youtube.com/@Tenbob_YT" target="_blank" rel="noopener">LIVE NOW on YouTube</a>
  </div>

  <footer id="foot">
    <a href="/">Tenbob</a>
    <span class="sep">·</span>
    <span>Not financial advice. Not a promise of gains. Public prices can be delayed. Not affiliated with Ripple.</span>
  </footer>
